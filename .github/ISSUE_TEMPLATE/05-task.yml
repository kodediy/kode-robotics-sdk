name: Task
description: A planned piece of work - a slice, a chore, a release step.
type: Task
assignees:
  - vmlorenzorod
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true once this is done, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that close this issue - host tests green, `tools/check_layers.sh` clean, verified on a module (which one).
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to the related issues, discussions and pull requests, the components it touches.
